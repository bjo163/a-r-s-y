name: A-R-S-Y CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arsy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and test control plane
        working-directory: apps/control-plane
        run: |
          npm install --no-audit --no-fund
          npm test
          node --check src/server.js

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/arsy-deploy.sh
          bash -n scripts/arsy-update.sh
          bash -n scripts/arsy-doctor.sh
